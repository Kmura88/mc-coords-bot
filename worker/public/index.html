<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>座標マップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  /* 石材のグレーを地に、サイトのタイトルだけゲーム風のドット文字。ほかは読みやすさ優先で端末の標準書体 */
  :root {
    --ground: #dcddd9; --panel: #f3f3f0; --field: #ffffff; --text: #1f2124; --muted: #61656b;
    --line: #b9bbb6; --hover: #e7e8e4; --edge: #8e918b;
    --go: #3c8527; --go-edge: #1d4d13; --stop: #b3261e; --map-bg: #1b2a3a;
    --hud-bg: rgba(0, 0, 0, .55);
    --pixel: "DotGothic16", "MS Gothic", "Osaka-Mono", monospace;
    --body: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", "Meiryo", "Noto Sans JP", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #232427; --panel: #2d2e33; --field: #1f2023; --text: #e6e6e3; --muted: #9c9ea3;
      --line: #45474d; --hover: #36383d; --edge: #17181a;
      --go: #4a9a32; --go-edge: #22561a; --stop: #f2867e; --map-bg: #0f1822;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #232427; --panel: #2d2e33; --field: #1f2023; --text: #e6e6e3; --muted: #9c9ea3;
    --line: #45474d; --hover: #36383d; --edge: #17181a;
    --go: #4a9a32; --go-edge: #22561a; --stop: #f2867e; --map-bg: #0f1822;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ground); color: var(--text);
    font: 14px/1.6 var(--body);
    display: flex; height: 100dvh; overflow: hidden;
  }
  :focus-visible { outline: 2px solid var(--go); outline-offset: 2px; }

  /* ---- サイドバー */
  #side {
    width: 300px; flex: none; display: flex; flex-direction: column;
    background: var(--panel); border-right: 2px solid var(--edge);
  }
  #side header { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  #side h1 {
    font: 22px/1.2 var(--pixel); margin: 0 0 12px;
    display: flex; align-items: center; gap: 8px;
  }
  #side h1 span { flex: 1; }

  /* 統合版のボタンのように、下端を濃くして押せる面に見せる */
  .btn {
    font: 13px/1.4 var(--body); padding: 5px 12px 7px; cursor: pointer; border-radius: 2px;
    background: var(--field); color: var(--text); border: 1px solid var(--line);
    box-shadow: inset 0 -3px 0 var(--line);
  }
  .btn:hover { background: var(--hover); }
  .btn:active { box-shadow: none; padding: 6px 12px; transform: translateY(1px); }
  .btn.primary { background: var(--go); border-color: var(--go-edge); color: #fff; box-shadow: inset 0 -3px 0 var(--go-edge); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--stop); }
  .btn:disabled { opacity: .6; cursor: default; }

  #search {
    width: 100%; padding: 7px 10px; font: inherit; color: var(--text);
    background: var(--field); border: 1px solid var(--line); border-radius: 2px;
  }
  #filters { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .chip {
    font: 12px/1.4 var(--body); padding: 2px 8px 2px 6px; cursor: pointer; border-radius: 2px;
    background: transparent; color: var(--text); border: 1px solid var(--line);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip:hover { background: var(--hover); }
  .swatch { display: inline-block; width: 10px; height: 10px; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
  .chip.hidden { color: var(--muted); text-decoration: line-through; border-style: dashed; }
  .chip.hidden .swatch { opacity: .25; }
  #nether-toggle { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px; color: var(--muted); cursor: pointer; }
  #nether-toggle input { accent-color: var(--go); margin: 0; }

  #list { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; flex: 1; }
  #list li { padding: 9px 16px; cursor: pointer; }
  #list li:hover { background: var(--hover); }
  #list li.off { cursor: default; }
  #list li.off .name { color: var(--muted); }
  #list .name { font-weight: 700; display: flex; align-items: center; gap: 7px; }
  #list .n { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #list .pos { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); margin-left: 17px; }
  #list .note { color: var(--muted); font-size: 12px; margin-left: 17px; }
  #list .edit { font: 12px var(--body); color: var(--muted); background: none; border: none; cursor: pointer; padding: 0; }
  #list .edit:hover { color: var(--text); text-decoration: underline; }
  #list .tag { font-size: 11px; font-weight: 400; padding: 0 5px; border: 1px solid var(--line); color: var(--muted); }
  #list .empty { cursor: default; color: var(--muted); padding: 16px; }
  #list .empty:hover { background: none; }
  #status { padding: 8px 16px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }

  /* ---- 地図 */
  #map { flex: 1; background: var(--map-bg); font: 14px/1.5 var(--body); }
  /* ゲーム内の座標表示と同じ位置・見た目 */
  #coords {
    position: absolute; left: 10px; top: 10px; z-index: 1000; pointer-events: none;
    background: var(--hud-bg); color: #fff; padding: 2px 8px 3px;
    font: 700 14px/1.5 var(--body); font-variant-numeric: tabular-nums; border-radius: 3px;
  }
  #coords:empty { display: none; }
  .pin-label {
    background: var(--hud-bg); color: #fff; border: none; border-radius: 0; box-shadow: none;
    font: 700 12px/1.5 var(--body); padding: 1px 6px; border-radius: 3px;
  }
  .pin-label::before { display: none; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--panel); color: var(--text); border-radius: 2px;
    box-shadow: 0 2px 0 var(--edge), 0 6px 18px rgba(0,0,0,.3);
  }
  .leaflet-popup-content { font: 13px/1.6 var(--body); margin: 12px 14px; }
  .leaflet-popup-content b { font-size: 14px; }
  .leaflet-popup-content .pos { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; display: block; margin-top: 2px; }
  .leaflet-popup-content .muted { color: var(--muted); }
  .leaflet-popup-content .actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
  .leaflet-bar a { background: var(--panel); color: var(--text); border-color: var(--line); border-radius: 0 !important; }
  .leaflet-bar a:hover { background: var(--hover); }

  /* ---- 追加・編集フォーム */
  dialog {
    border: 1px solid var(--line); border-radius: 2px; padding: 0; width: min(380px, calc(100vw - 32px));
    background: var(--panel); color: var(--text); box-shadow: 0 3px 0 var(--edge);
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog form { padding: 18px 20px; display: grid; gap: 10px; }
  dialog h2 { font-size: 17px; margin: 0 0 4px; }
  dialog label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  dialog input, dialog select, dialog textarea {
    font: inherit; font-size: 14px; color: var(--text); background: var(--field);
    border: 1px solid var(--line); border-radius: 2px; padding: 6px 8px; width: 100%;
  }
  dialog input[type="number"] { font-variant-numeric: tabular-nums; }
  dialog label[hidden] { display: none; }
  dialog textarea { resize: vertical; min-height: 54px; }
  dialog .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  dialog .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  #form-error { color: var(--stop); font-size: 13px; min-height: 1em; margin: 0; }

  #toggle { display: none; }
  @media (max-width: 700px) {
    body { flex-direction: column-reverse; }
    #side { width: 100%; height: 42dvh; border-right: none; border-top: 2px solid var(--edge); }
    #side h1 { font-size: 18px; margin-bottom: 10px; }
    #side.collapsed { height: auto; }
    #side.collapsed header { border-bottom: none; }
    #side.collapsed h1 { margin-bottom: 0; }
    #side.collapsed #list, #side.collapsed #status, #side.collapsed #search,
    #side.collapsed #filters, #side.collapsed #nether-toggle { display: none; }
    #toggle { display: inline-block; }
  }
</style>
</head>
<body>
<aside id="side">
  <header>
    <h1><span>座標マップ</span><button id="add" class="btn primary" type="button" hidden>座標を追加</button><button id="toggle" class="btn" type="button">一覧</button></h1>
    <input id="search" type="search" placeholder="名前・メモで検索" aria-label="名前・メモで検索">
    <div id="filters" role="group" aria-label="カテゴリで絞り込み"></div>
    <label id="nether-toggle"><input id="show-nether" type="checkbox">ネザーの座標も地図に出す（8倍の位置）</label>
  </header>
  <ul id="list"></ul>
  <div id="status">読み込み中…</div>
</aside>
<div id="map"><div id="coords"></div></div>

<dialog id="editor">
  <form method="dialog">
    <h2 id="form-title">座標を追加</h2>
    <label>名前<input name="name" required maxlength="50" placeholder="拠点、村、ピグリン交易所など"></label>
    <div class="row">
      <label>X<input name="x" type="number" required step="1" inputmode="numeric"></label>
      <label>Y（任意）<input name="y" type="number" step="1" min="-64" max="320" inputmode="numeric"></label>
      <label>Z<input name="z" type="number" required step="1" inputmode="numeric"></label>
    </div>
    <label>ディメンション
      <select name="dimension">
        <option value="overworld">オーバーワールド</option>
        <option value="nether">ネザー</option>
        <option value="end">エンド</option>
      </select>
    </label>
    <label>カテゴリ<select name="category"></select></label>
    <label>メモ（任意）<textarea name="note" maxlength="200"></textarea></label>
    <label id="author-label">あなたの名前<input name="author" required maxlength="32" placeholder="登録者として表示されます"></label>
    <p id="form-error"></p>
    <div class="buttons">
      <button class="btn" type="button" value="cancel" id="form-cancel">キャンセル</button>
      <button class="btn primary" type="submit" id="form-save">保存</button>
    </div>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const CATEGORIES = {
  // 色はゲーム内の染料に合わせている
  base: { label: "拠点", color: "#b02e26" },
  village: { label: "村", color: "#fed83d" },
  ruins: { label: "遺跡", color: "#835432" },
  cave: { label: "洞窟", color: "#3c44aa" },
  portal: { label: "ポータル", color: "#8932b8" },
  resource: { label: "資源", color: "#169c9c" },
  farm: { label: "装置・トラップ", color: "#80c71f" },
  other: { label: "その他", color: "#9d9d97" },
};
const DIM = { overworld: "オーバーワールド", nether: "ネザー", end: "エンド" };
const params = new URLSearchParams(location.search);
const key = params.get("key") || "";
let focusId = params.get("focus");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// マイクラ座標をそのまま使う: lat = Z（南が正）, lng = X。ズーム0で 1px = 16ブロック
const CRS = L.extend({}, L.CRS.Simple, { transformation: new L.Transformation(1 / 16, 0, 1 / 16, 0) });
const map = L.map("map", { crs: CRS, minZoom: 0, maxZoom: 6, zoomSnap: 0.5, attributionControl: false })
  .setView([0, 0], 2);
map.zoomControl.setPosition("topright"); // 左上はゲームと同じく座標表示に使う

const markers = new L.LayerGroup().addTo(map);
let points = [];
const byId = new Map();
let canEdit = false; // 合言葉が正しいときだけ追加・編集できる

// 表示の絞り込み（ブラウザに記憶）
const view = (() => {
  try { return { hidden: [], nether: false, ...JSON.parse(localStorage.getItem("view") || "{}") }; }
  catch { return { hidden: [], nether: false }; }
})();
function saveView() { try { localStorage.setItem("view", JSON.stringify(view)); } catch {} }

fetch("tiles/meta.json").then((r) => r.json()).then((meta) => {
  const R = meta.radius;
  L.tileLayer("tiles/{z}/{y}/{x}.webp", {
    tileSize: 256, minZoom: 0, maxZoom: 6, maxNativeZoom: meta.maxNativeZoom,
    bounds: [[-R, -R], [R, R]], noWrap: true,
  }).addTo(map).bringToBack();
  map.setMaxBounds([[-R * 1.1, -R * 1.1], [R * 1.1, R * 1.1]]);
}).catch(() => setStatus("地図タイルがありません（gen_tiles.py を実行してください）"));

const coordsEl = document.getElementById("coords");
map.on("mouseout", () => (coordsEl.textContent = ""));
map.on("mousemove", (e) => {
  coordsEl.textContent = `位置: ${Math.floor(e.latlng.lng)}, ${Math.floor(e.latlng.lat)}`;
});

map.on("click", (e) => {
  const x = Math.floor(e.latlng.lng), z = Math.floor(e.latlng.lat);
  const cmd = `/add name: x:${x} z:${z}`;
  const el = document.createElement("div");
  el.innerHTML = `<span class="pos">X ${x}　Z ${z}</span>` +
    `<span class="muted">ネザーでは X ${Math.floor(x / 8)}　Z ${Math.floor(z / 8)}</span>` +
    `<div class="actions"></div>`;
  const actions = el.querySelector(".actions");
  if (canEdit) {
    actions.append(button("ここを登録", "btn primary", () => { map.closePopup(); openEditor({ x, z }); }));
  }
  actions.append(button("コマンドをコピー", "btn", (ev) => {
    navigator.clipboard?.writeText(cmd).then(() => (ev.target.textContent = "コピーしました"));
  }));
  L.popup().setLatLng(e.latlng).setContent(el).openOn(map);
});

function button(label, cls, onclick) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = cls;
  b.textContent = label;
  b.onclick = onclick;
  return b;
}

function setStatus(s) { document.getElementById("status").textContent = s; }
function category(p) { return Object.hasOwn(CATEGORIES, p.category) ? CATEGORIES[p.category] : CATEGORIES.other; }
function color(p) { return category(p).color; }

// 地図に出すかどうか（エンドは座標系が違うので出さない）
function visible(p) {
  if (view.hidden.includes(p.category || "other")) return false;
  return p.dimension === "overworld" || (p.dimension === "nether" && view.nether);
}

function render() {
  markers.clearLayers();
  byId.clear();
  for (const p of points) {
    if (!visible(p)) continue;
    const nether = p.dimension === "nether";
    // ネザーの座標は 8 倍した地上の位置に、点線の枠で描く
    const m = L.circleMarker(nether ? [p.z * 8, p.x * 8] : [p.z, p.x], {
      radius: 7, color: "#fff", weight: 2, dashArray: nether ? "2 3" : null,
      fillColor: color(p), fillOpacity: nether ? 0.55 : 1,
    }).bindTooltip(`#${p.id} ${escapeHtml(p.name)}${nether ? "（ネザー）" : ""}`, {
      permanent: true, direction: "right", offset: [8, 0], className: "pin-label",
    }).bindPopup(() => popupEl(p));
    markers.addLayer(m);
    byId.set(String(p.id), m);
  }
  renderList();
}

function popupEl(p) {
  const y = p.y !== null ? `　Y ${p.y}` : "";
  const el = document.createElement("div");
  const nether = p.dimension === "nether";
  const conv = nether
    ? `地上では X ${p.x * 8}　Z ${p.z * 8}`
    : `ネザーでは X ${Math.floor(p.x / 8)}　Z ${Math.floor(p.z / 8)}`;
  el.innerHTML = `<b>#${p.id} ${escapeHtml(p.name)}</b> <span class="muted">${category(p).label}${nether ? "（ネザー）" : ""}</span>` +
    `<span class="pos">X ${p.x}${y}　Z ${p.z}</span>` +
    `<span class="muted">${conv}</span>` +
    (p.note ? `<br>${escapeHtml(p.note)}` : "") +
    `<br><small class="muted">登録: ${escapeHtml(p.author)}（${escapeHtml(p.created_at)}）</small>`;
  if (canEdit) {
    const actions = document.createElement("div");
    actions.className = "actions";
    actions.append(
      button("編集", "btn", () => { map.closePopup(); openEditor(p); }),
      button("削除", "btn danger", () => removePoint(p)),
    );
    el.append(actions);
  }
  return el;
}

function renderList() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const list = document.getElementById("list");
  list.replaceChildren();
  const shown = points.filter((p) => !view.hidden.includes(p.category || "other") &&
    (!q || p.name.toLowerCase().includes(q) || (p.note || "").toLowerCase().includes(q)));
  for (const p of shown) {
    const li = document.createElement("li");
    const onMap = byId.has(String(p.id));
    li.className = onMap ? "" : "off";
    const y = p.y !== null ? `　Y ${p.y}` : "";
    li.innerHTML = `<div class="name"><span class="swatch"></span><span class="n"></span></div>` +
      `<div class="pos">X ${p.x}${y}　Z ${p.z}</div>`;
    li.querySelector(".swatch").style.background = color(p);
    li.querySelector(".n").textContent = `#${p.id} ${p.name}`;
    if (p.dimension !== "overworld") li.querySelector(".name").insertAdjacentHTML("beforeend", `<span class="tag">${DIM[p.dimension]}</span>`);
    if (p.note) {
      const note = document.createElement("div");
      note.className = "note";
      note.textContent = p.note;
      li.append(note);
    }
    if (canEdit) {
      li.querySelector(".name").append(button("編集", "edit", (ev) => { ev.stopPropagation(); openEditor(p); }));
    }
    if (onMap) li.onclick = () => focus(p.id);
    list.append(li);
  }
  if (!shown.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = points.length
      ? "条件に合う座標はありません。検索語やカテゴリの絞り込みを変えてください。"
      : canEdit ? "まだ座標がありません。地図をクリックすると、その場所を登録できます。"
      : "まだ座標がありません。Discord の /add で登録できます。";
    list.append(li);
  }
  setStatus(`${points.length} 件（地図に ${byId.size} 件表示）`);
}

function renderFilters() {
  const box = document.getElementById("filters");
  box.replaceChildren();
  for (const [k, c] of Object.entries(CATEGORIES)) {
    const chip = button("", "chip" + (view.hidden.includes(k) ? " hidden" : ""), () => {
      view.hidden = view.hidden.includes(k) ? view.hidden.filter((h) => h !== k) : [...view.hidden, k];
      saveView();
      renderFilters();
      render();
    });
    chip.setAttribute("aria-pressed", String(!view.hidden.includes(k)));
    chip.innerHTML = `<span class="swatch"></span>`;
    chip.querySelector(".swatch").style.background = c.color;
    chip.append(c.label);
    box.append(chip);
  }
  document.getElementById("show-nether").checked = view.nether;
}

function focus(id) {
  let m = byId.get(String(id));
  if (!m) {
    // 絞り込みで隠れている座標を指定されたら、表示を広げてから移動する
    const p = points.find((p) => String(p.id) === String(id));
    if (!p || p.dimension === "end") return;
    view.hidden = view.hidden.filter((h) => h !== (p.category || "other"));
    if (p.dimension === "nether") view.nether = true;
    saveView();
    renderFilters();
    render();
    m = byId.get(String(id));
    if (!m) return;
  }
  // スマホでは一覧をたたんで地図を広げてから移動する
  if (matchMedia("(max-width: 700px)").matches) setCollapsed(true);
  map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 3), { duration: 0.6, animate: !reduceMotion });
  m.openPopup();
}

// サイドバーの開閉で地図の大きさが変わるので Leaflet に知らせる
function setCollapsed(collapsed) {
  document.getElementById("side").classList.toggle("collapsed", collapsed);
  map.invalidateSize();
}

async function load() {
  try {
    const res = await fetch(`api/points?key=${encodeURIComponent(key)}`);
    if (res.status === 403) {
      setStatus("このリンクでは座標を表示できません。Discord の /map で出るリンクから開いてください。");
      return;
    }
    if (!canEdit && key) {
      canEdit = true;
      document.getElementById("add").hidden = false;
      load.last = null; // 編集ボタン付きで描き直す
    }
    const text = await res.text();
    if (text !== load.last) {
      load.last = text;
      points = JSON.parse(text);
      render();
    }
    if (focusId) { focus(focusId); focusId = null; }
    else if (!load.done && byId.size) map.fitBounds(L.featureGroup([...byId.values()]).getBounds().pad(0.2), { maxZoom: 3 });
    load.done = true;
  } catch {
    setStatus("座標の読み込みに失敗しました");
  }
}

// ---- 追加・編集フォーム
const editor = document.getElementById("editor");
const form = editor.querySelector("form");
let editing = null; // 編集中の座標（新規なら null）

function readName() { try { return localStorage.getItem("author") || ""; } catch { return ""; } }
function saveName(v) { try { localStorage.setItem("author", v); } catch {} }

function openEditor(p) {
  editing = p.id ? p : null;
  form.reset();
  document.getElementById("form-title").textContent = editing ? `#${p.id} を編集` : "座標を追加";
  document.getElementById("author-label").hidden = !!editing;
  document.getElementById("form-error").textContent = "";
  for (const k of ["name", "x", "y", "z", "note"]) form.elements[k].value = p[k] ?? "";
  form.elements.dimension.value = p.dimension || "overworld";
  form.elements.category.value = p.category || "other";
  form.elements.author.value = readName();
  form.elements.author.required = !editing;
  editor.showModal();
  form.elements.name.focus();
}

document.getElementById("form-cancel").onclick = () => editor.close();

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = form.elements;
  const body = {
    name: f.name.value, x: f.x.value, y: f.y.value, z: f.z.value,
    dimension: f.dimension.value, category: f.category.value, note: f.note.value,
  };
  if (!editing) {
    body.author = f.author.value;
    saveName(f.author.value.trim());
  }
  const save = document.getElementById("form-save");
  save.disabled = true;
  try {
    const res = await fetch(editing ? `api/points/${editing.id}?key=${encodeURIComponent(key)}` : `api/points?key=${encodeURIComponent(key)}`, {
      method: editing ? "PATCH" : "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) {
      document.getElementById("form-error").textContent = data.error || "保存に失敗しました";
      return;
    }
    editor.close();
    focusId = data.dimension !== "end" ? String(data.id) : null;
    await load();
  } catch {
    document.getElementById("form-error").textContent = "保存に失敗しました（通信エラー）";
  } finally {
    save.disabled = false;
  }
});

async function removePoint(p) {
  if (!confirm(`#${p.id} ${p.name} を削除しますか？`)) return;
  const res = await fetch(`api/points/${p.id}?key=${encodeURIComponent(key)}`, { method: "DELETE" });
  if (!res.ok) { alert("削除に失敗しました"); return; }
  map.closePopup();
  await load();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

document.getElementById("search").addEventListener("input", renderList);
document.getElementById("show-nether").addEventListener("change", (e) => {
  view.nether = e.target.checked;
  saveView();
  render();
});
for (const [k, c] of Object.entries(CATEGORIES)) form.elements.category.add(new Option(c.label, k));
renderFilters();
document.getElementById("add").onclick = () => {
  const c = map.getCenter();
  openEditor({ x: Math.floor(c.lng), z: Math.floor(c.lat) });
};
document.getElementById("toggle").onclick = () =>
  setCollapsed(!document.getElementById("side").classList.contains("collapsed"));
load();
setInterval(load, 60000);
</script>
</body>
</html>
